name: Golden Query Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe live NEW / Refurbished / Used offer contract
        shell: bash
        run: python tests/condition_offer_probe.py | tee condition-offer.log

      - name: Probe exact ZT610 product payload
        shell: bash
        run: python tests/zt610_product_payload_probe.py | tee zt610-payload.log

      - name: Probe TC27 product-tag relationships
        shell: bash
        run: python tests/tc27_relationship_probe.py 2>&1 | tee tc27-relationships.log

      - name: Probe model-tag lifecycle hygiene
        shell: bash
        run: python tests/model_tag_lifecycle_probe.py 2>&1 | tee model-tag-lifecycle.log

      - name: Run golden query discovery probe
        shell: bash
        run: |
          set -o pipefail
          python tests/golden_probe_runner.py 2>&1 | tee golden-probe.log

      - name: Publish probe diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- autoid-golden-probe -->';
            const conditionOffer = fs.existsSync('condition-offer.log')
              ? fs.readFileSync('condition-offer.log', 'utf8')
              : 'condition-offer.log was not created.';
            const payload = fs.existsSync('zt610-payload.log')
              ? fs.readFileSync('zt610-payload.log', 'utf8')
              : 'zt610-payload.log was not created.';
            let tc27 = fs.existsSync('tc27-relationships.log')
              ? fs.readFileSync('tc27-relationships.log', 'utf8')
              : 'tc27-relationships.log was not created.';
            let lifecycle = fs.existsSync('model-tag-lifecycle.log')
              ? fs.readFileSync('model-tag-lifecycle.log', 'utf8')
              : 'model-tag-lifecycle.log was not created.';
            let golden = fs.existsSync('golden-probe.log')
              ? fs.readFileSync('golden-probe.log', 'utf8')
              : 'golden-probe.log was not created.';

            const relationshipMaxChars = 50000;
            if (tc27.length > relationshipMaxChars) {
              tc27 = '[...truncated to last 50000 characters...]\n' + tc27.slice(-relationshipMaxChars);
            }

            const lifecycleMaxChars = 50000;
            if (lifecycle.length > lifecycleMaxChars) {
              lifecycle = '[...truncated to last 50000 characters...]\n' + lifecycle.slice(-lifecycleMaxChars);
            }

            const goldenMaxChars = 40000;
            if (golden.length > goldenMaxChars) {
              golden = '[...truncated to last 40000 characters...]\n' + golden.slice(-goldenMaxChars);
            }

            const status = '${{ job.status }}';
            const body = `${marker}\n## Golden Query Probe diagnostics\n\n**Job status:** ${status}\n\n### Live condition offer contract\n\n\`\`\`text\n${conditionOffer}\n\`\`\`\n\n### Model-tag lifecycle hygiene\n\n\`\`\`text\n${lifecycle}\n\`\`\`\n\n### TC27 child product-tag relationship discovery\n\n\`\`\`text\n${tc27}\n\`\`\`\n\n<details><summary>Focused ZT610 get_product payload</summary>\n\n\`\`\`text\n${payload}\n\`\`\`\n</details>\n\n<details><summary>Full golden-query output</summary>\n\n\`\`\`text\n${golden}\n\`\`\`\n</details>`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
